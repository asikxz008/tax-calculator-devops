apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: tax-fetch-source
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  results:
    - name: commit
      description: Checked out commit SHA
  steps:
    - name: clone
      image: icr.io/continuous-delivery/pipeline/pipeline-base-ubi:3.87
      workingDir: $(workspaces.source.path)
      env:
        - name: REPO_URL
          value: $(params.url)
        - name: REVISION
          value: $(params.revision)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        git init repo
        cd repo
        git remote add origin "$REPO_URL"
        git fetch --depth=1 origin "$REVISION"
        git checkout --detach FETCH_HEAD
        git rev-parse HEAD | tr -d '\n' > "$(results.commit.path)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: tax-jasmine
spec:
  workspaces:
    - name: source
  steps:
    - name: test
      image: node:22-bookworm-slim
      workingDir: $(workspaces.source.path)/repo
      script: |
        #!/bin/sh
        set -eu
        npm ci --ignore-scripts --no-audit --no-fund
        npm test
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: tax-build-push
spec:
  params:
    - name: image
      type: string
  workspaces:
    - name: source
    - name: registry-auth
      readOnly: true
  results:
    - name: digest
      description: Immutable digest returned by the registry push
  steps:
    - name: build-push
      image: quay.io/buildah/stable:v1.39.3
      workingDir: $(workspaces.source.path)/repo
      securityContext:
        privileged: true
        runAsUser: 0
      env:
        - name: IMAGE
          value: $(params.image)
        - name: REGISTRY_AUTH_FILE
          value: $(workspaces.registry-auth.path)/.dockerconfigjson
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        buildah --storage-driver=vfs bud --isolation=chroot -t "$IMAGE" .
        buildah --storage-driver=vfs push --digestfile "$(results.digest.path)" "$IMAGE" "docker://$IMAGE"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: tax-deploy-code-engine
spec:
  params:
    - name: image
      type: string
    - name: region
      type: string
    - name: resource-group
      type: string
    - name: project
      type: string
    - name: app
      type: string
      default: tax-calculator
    - name: registry-secret
      type: string
      default: icr-pull
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: icr.io/continuous-delivery/pipeline/pipeline-base-ubi:3.87
      workingDir: $(workspaces.source.path)/repo
      env:
        - name: IBMCLOUD_API_KEY
          valueFrom:
            secretKeyRef:
              name: ibm-cloud-credentials
              key: apikey
        - name: IMAGE
          value: $(params.image)
        - name: REGION
          value: $(params.region)
        - name: RESOURCE_GROUP
          value: $(params.resource-group)
        - name: CE_PROJECT
          value: $(params.project)
        - name: APP_NAME
          value: $(params.app)
        - name: REGISTRY_SECRET
          value: $(params.registry-secret)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        bash scripts/deploy-ibm.sh
