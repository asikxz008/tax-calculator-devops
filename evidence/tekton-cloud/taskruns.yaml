    taskSpec:
      description: |-
        Buildah task builds source into a container image and then pushes it to a container registry.
        Buildah Task builds source into a container image using Project Atomic's Buildah build tool.It uses Buildah's support for building from Dockerfiles, using its buildah bud command.This command executes the directives in the Dockerfile to assemble a container image, then pushes that image to a container registry.
      params:
      - description: Reference of the image buildah will produce.
        name: IMAGE
        type: string
      - default: registry.redhat.io/rhel8/buildah@sha256:aac6629389db17e99894c5bee0da01d4c8065d11d8c6f6e1602f9484290baa70
        description: The location of the buildah builder image.
        name: BUILDER_IMAGE
        type: string
      - default: vfs
        description: Set buildah storage driver
        name: STORAGE_DRIVER
        type: string
      - default: ./Dockerfile
        description: Path to the Dockerfile to build.
        name: DOCKERFILE
        type: string
      - default: .
        description: Path to the directory to use as context.
        name: CONTEXT
        type: string
      - default: "true"
        description: Verify the TLS on the registry endpoint (for push/pull to a non-TLS
          registry)
        name: TLSVERIFY
        type: string
      - default: oci
        description: The format of the built container, oci or docker
        name: FORMAT
        type: string
      - default: ""
        description: Extra parameters passed for the build command when building images.
        name: BUILD_EXTRA_ARGS
        type: string
      - default: ""
        description: Extra parameters passed for the push command when pushing images.
        name: PUSH_EXTRA_ARGS
        type: string
      - default: "false"
        description: Skip pushing the built image
        name: SKIP_PUSH
        type: string
      results:
      - description: Digest of the image just built.
        name: IMAGE_DIGEST
        type: string
      - description: Image repository where the built image would be pushed to
        name: IMAGE_URL
        type: string
      steps:
      - computeResources: {}
        image: registry.redhat.io/rhel8/buildah@sha256:aac6629389db17e99894c5bee0da01d4c8065d11d8c6f6e1602f9484290baa70
        name: build-and-push
        script: |
          ENTITLEMENT_VOLUME=""

          if [[ "false" == "true" ]]; then
            ENTITLEMENT_VOLUME="--volume /tmp/entitlement:/etc/pki/entitlement"
          fi

          buildah bud --storage-driver=vfs \
            $ENTITLEMENT_VOLUME --isolation=chroot \
            --format=docker --tls-verify=true \
            -f repo/Dockerfile -t us.icr.io/sn-labs-sabyraslan20/tax-calculator:tax-calculator-lab-v9zmh repo

          [[ "false" == "true" ]] && echo "Push skipped" && exit 0

          if [[ "true" == "true" ]]; then

            # if config.json exists at workspace root, we use that
            if test -f "/workspace/dockerconfig/config.json"; then
              export DOCKER_CONFIG="/workspace/dockerconfig"

            # else we look for .dockerconfigjson at the root
            elif test -f "/workspace/dockerconfig/.dockerconfigjson"; then
              cp "/workspace/dockerconfig/.dockerconfigjson" "$HOME/.docker/config.json"
              export DOCKER_CONFIG="$HOME/.docker"

            # need to error out if neither files are present
            else
              echo "neither 'config.json' nor '.dockerconfigjson' found at workspace root"
              exit 1
            fi
          fi

          buildah --storage-driver=vfs push \
             --tls-verify=true \
            --digestfile /tmp/image-digest us.icr.io/sn-labs-sabyraslan20/tax-calculator:tax-calculator-lab-v9zmh \
            docker://us.icr.io/sn-labs-sabyraslan20/tax-calculator:tax-calculator-lab-v9zmh
          cat /tmp/image-digest | tee /tekton/results/IMAGE_DIGEST
          echo -n "us.icr.io/sn-labs-sabyraslan20/tax-calculator:tax-calculator-lab-v9zmh" | tee /tekton/results/IMAGE_URL
        securityContext:
          capabilities:
            add:
            - SETFCAP
        volumeMounts:
        - mountPath: /var/lib/containers
          name: varlibcontainers
        workingDir: /workspace/source
      volumes:
      - emptyDir: {}
        name: varlibcontainers
      workspaces:
      - name: source
      - description: An optional workspace that allows providing a .docker/config.json
          file for Buildah to access the container registry. The file should be placed
          at the root of the Workspace with name config.json or .dockerconfigjson.
        name: dockerconfig
        optional: true
      - description: An optional workspace that allows providing the entitlement keys
          for Buildah to access subscription. The mounted workspace contains entitlement.pem
          and entitlement-key.pem.
        mountPath: /tmp/entitlement
        name: rhel-entitlement
        optional: true
