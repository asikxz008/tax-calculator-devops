# Run in the learner's Skills Network OpenShift namespace, not Code Engine's
# Kubernetes context. Registry credentials stay in a Kubernetes Secret.
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-lab-
spec:
  pipelineRef:
    name: tax-calculator-lab
  serviceAccountName: pipeline
  timeout: 30m
  params:
    - name: repo-url
      value: https://github.com/asikxz008/tax-calculator-devops.git
    - name: revision
      value: 5310dc53ec0e57fdea5a900e60a20d453cf4f267
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: skills-network-learner
          resources:
            requests:
              storage: 1Gi
    - name: registry-auth
      secret:
        secretName: docker-reg-creds

