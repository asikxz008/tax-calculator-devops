name: Real Tekton build and deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tekton-verification.yml
      - .tekton/verification.yaml
permissions:
  contents: read
jobs:
  tekton:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create disposable Kubernetes cluster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/tekton-verification
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64 -o /tmp/kind
          chmod +x /tmp/kind
          cat > /tmp/kind.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 30080
                  hostPort: 30080
                  listenAddress: 127.0.0.1
              extraMounts:
                - hostPath: /var/run/docker.sock
                  containerPath: /var/run/host-docker.sock
          EOF
          /tmp/kind create cluster --name tax-verification --config /tmp/kind.yaml --wait 120s
          kubectl version
      - name: Install Tekton Pipelines
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f https://storage.googleapis.com/tekton-releases/pipeline/previous/v1.0.0/release.yaml
          kubectl -n tekton-pipelines rollout status deployment/tekton-pipelines-controller --timeout=240s
          kubectl -n tekton-pipelines rollout status deployment/tekton-pipelines-webhook --timeout=240s
          kubectl apply -f .tekton/tasks.yaml
          kubectl apply -f .tekton/verification.yaml
      - name: Execute real Tekton PipelineRun
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > evidence/tekton-verification/run-submitted.yaml <<EOF
          apiVersion: tekton.dev/v1
          kind: PipelineRun
          metadata:
            name: tax-verification
          spec:
            pipelineRef: {name: tax-verification}
            timeouts: {pipeline: 20m}
            taskRunTemplate:
              serviceAccountName: tax-verification
            params:
              - name: revision
                value: $REVISION
              - name: image
                value: tax-calculator:tekton-$REVISION
            workspaces:
              - name: source
                volumeClaimTemplate:
                  spec:
                    accessModes: [ReadWriteOnce]
                    resources:
                      requests: {storage: 2Gi}
          EOF
          kubectl create -f evidence/tekton-verification/run-submitted.yaml
          for attempt in $(seq 1 240); do
            status=$(kubectl get pipelinerun tax-verification -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].status}')
            reason=$(kubectl get pipelinerun tax-verification -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].reason}')
            echo "PipelineRun status: $status ($reason)"
            if [ "$status" = True ]; then exit 0; fi
            if [ "$status" = False ]; then
              kubectl get pipelinerun tax-verification -o yaml
              exit 1
            fi
            sleep 5
          done
          echo 'PipelineRun timed out'
          exit 1
      - name: Verify deployed image and capture real application
        shell: bash
        run: |
          set -euo pipefail
          APP_URL=http://127.0.0.1:30080 node scripts/smoke.js | tee evidence/tekton-verification/smoke.txt
          kubectl get pods -l app=tax-calculator -o json > evidence/tekton-verification/deployed-pod.json
          kubectl get deployment tax-calculator -o yaml > evidence/tekton-verification/deployment.yaml
          docker image inspect tax-calculator:tekton-${{ github.sha }} > evidence/tekton-verification/docker-image.json
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1100 --virtual-time-budget=10000 --screenshot=evidence/tekton-verification/10-final-output.png http://127.0.0.1:30080
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom http://127.0.0.1:30080 > evidence/tekton-verification/rendered.html
          grep -F '$11,000.00' evidence/tekton-verification/rendered.html
          printf '%s\n' "Actual Tekton build and deployment in disposable kind Kubernetes on GitHub Actions." "Not an IBM Cloud deployment." "Commit: ${{ github.sha }}" "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" > evidence/tekton-verification/PROVENANCE.txt
      - name: Collect actual Tekton evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence/tekton-verification
          kubectl get pipelinerun tax-verification -o yaml > evidence/tekton-verification/run-status.yaml 2>&1 || true
          kubectl get taskruns -o yaml > evidence/tekton-verification/taskruns.yaml 2>&1 || true
          kubectl get pods -A -o wide > evidence/tekton-verification/pods.txt 2>&1 || true
          kubectl get events --sort-by=.lastTimestamp > evidence/tekton-verification/events.txt 2>&1 || true
          for pod in $(kubectl get pods -l tekton.dev/pipelineRun=tax-verification -o name); do
            name=${pod#pod/}
            kubectl logs "$pod" --all-containers=true --prefix=true > "evidence/tekton-verification/$name.txt" 2>&1 || true
            kubectl describe "$pod" > "evidence/tekton-verification/$name-describe.txt" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tekton-deployment-${{ github.run_id }}
          path: evidence/tekton-verification/
      - name: Remove disposable cluster
        if: always()
        run: /tmp/kind delete cluster --name tax-verification
